<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Focus — افهم تشتتك، حسّن تركيزك</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#3F5638" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F4EF;
    --surface: #FFFFFF;
    --ink: #23271F;
    --ink-soft: #656B5E;
    --ink-faint: #9AA093;
    --sage: #5B7553;
    --sage-deep: #3F5638;
    --sage-tint: #E7ECE2;
    --ochre: #B8863E;
    --ochre-tint: #F3E7D2;
    --clay: #A24B3F;
    --clay-tint: #F1DFDA;
    --line: #E4E1D6;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: 'IBM Plex Sans Arabic', Tahoma, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--ink); padding-bottom: 84px;
  }
  button, input, textarea, select { font-family: inherit; }
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 8px; max-width: 480px; margin: 0 auto;
  }
  .top-bar .brand { display: flex; align-items: baseline; gap: 8px; }
  .top-bar .brand-mark { font-size: 19px; font-weight: 700; letter-spacing: .2px; }
  .top-bar .brand-tag { font-size: 11px; color: var(--ink-faint); }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface); font-size: 16px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; color: var(--ink-soft);
  }
  .app { max-width: 480px; margin: 0 auto; padding: 4px 20px 28px; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 18px; margin-bottom: 14px;
  }
  .card-flat { background: transparent; border: none; padding: 0; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin: 22px 0 10px; }
  .section-title:first-child { margin-top: 4px; }
  .muted { color: var(--ink-soft); }
  .faint { color: var(--ink-faint); }

  h1, h2, h3 { margin: 0; }
  .greeting { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
  .greeting-sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 16px; }

  .main-focus-label { font-size: 12px; font-weight: 700; color: var(--sage-deep); margin-bottom: 8px; }
  .main-focus-input {
    width: 100%; border: none; background: transparent; font-size: 17px; font-weight: 600;
    color: var(--ink); resize: none; padding: 0; line-height: 1.5; min-height: 26px;
  }
  .main-focus-input::placeholder { color: var(--ink-faint); font-weight: 500; }
  .main-focus-input:focus { outline: none; }

  .stat-row { display: flex; gap: 10px; }
  .stat-chip {
    flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 12px 10px; text-align: center; cursor: pointer;
  }
  .stat-chip .stat-val { font-size: 18px; font-weight: 700; }
  .stat-chip .stat-lbl { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  .ring { border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ring-inner {
    background: var(--surface); border-radius: 50%; width: 76%; height: 76%; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
  }
  .ring-num { font-size: 22px; font-weight: 700; line-height: 1; }
  .ring-cap { font-size: 10px; color: var(--ink-soft); margin-top: 3px; }

  .score-row { display: flex; align-items: center; gap: 16px; }
  .score-text-title { font-size: 15px; font-weight: 700; }
  .score-text-desc { font-size: 12px; color: var(--ink-soft); margin-top: 3px; line-height: 1.5; }

  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 9px 14px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink);
    display: flex; align-items: center; gap: 6px;
  }
  .chip:active { background: var(--sage-tint); border-color: var(--sage); }
  .chip-add {
    border-style: dashed; color: var(--ink-soft);
  }

  .habit-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .habit-row:last-child { border-bottom: none; }
  .habit-check {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0;
    cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px;
    color: transparent; background: var(--surface);
  }
  .habit-check.done { background: var(--sage); border-color: var(--sage); color: #fff; }
  .habit-name { font-size: 14px; font-weight: 600; flex: 1; }
  .habit-name.done-text { color: var(--ink-faint); text-decoration: line-through; }
  .habit-meta { font-size: 11px; color: var(--ink-soft); }
  .habit-streak { font-size: 12px; font-weight: 700; color: var(--ochre); white-space: nowrap; }
  .habit-del { color: var(--ink-faint); font-size: 15px; padding: 4px 6px; cursor: pointer; }

  .list-empty { text-align: center; color: var(--ink-faint); font-size: 13px; padding: 26px 10px; }

  .btn-primary {
    width: 100%; padding: 13px; border-radius: var(--radius-md); border: none; background: var(--sage-deep);
    color: #fff; font-weight: 700; font-size: 15px; cursor: pointer;
  }
  .btn-secondary {
    width: 100%; padding: 12px; border-radius: var(--radius-md); border: 1.5px solid var(--line);
    background: var(--surface); color: var(--ink); font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .btn-danger { color: var(--clay); border-color: var(--clay); }
  .btn-ghost { background: none; border: none; color: var(--ink-soft); font-weight: 600; font-size: 13px; padding: 10px; width: 100%; cursor: pointer; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row > * { flex: 1; }

  .field-label { font-size: 12px; font-weight: 700; color: var(--ink-soft); margin: 12px 0 6px; }
  .field-label:first-child { margin-top: 0; }
  .text-input, .num-input {
    width: 100%; border: 1.5px solid var(--line); border-radius: var(--radius-sm); padding: 11px;
    font-size: 14px; background: var(--surface); color: var(--ink);
  }
  textarea.text-input { resize: vertical; min-height: 60px; }

  .scale-row { display: flex; gap: 6px; }
  .scale-btn {
    flex: 1; padding: 9px 0; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface);
    font-size: 13px; font-weight: 700; cursor: pointer; color: var(--ink-soft);
  }
  .scale-btn.sel { background: var(--sage); border-color: var(--sage); color: #fff; }

  .bars-wrap { display: flex; align-items: flex-end; gap: 8px; height: 130px; padding: 10px 2px 0; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .bar-val { font-size: 10px; color: var(--ink-soft); margin-bottom: 4px; }
  .bar-fill { width: 100%; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--sage), var(--sage-deep)); }
  .bar-lbl { font-size: 10px; color: var(--ink-faint); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

  .kv-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .kv-row:last-child { border-bottom: none; }
  .kv-label { font-size: 13px; color: var(--ink-soft); }
  .kv-val { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .trend-up { color: var(--sage-deep); font-size: 11px; font-weight: 700; }
  .trend-down { color: var(--clay); font-size: 11px; font-weight: 700; }
  .trend-flat { color: var(--ink-faint); font-size: 11px; font-weight: 700; }

  .insight-card {
    border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 10px; font-size: 13.5px;
    line-height: 1.6; border: 1px solid var(--line); background: var(--surface);
  }
  .insight-card.emph { background: var(--sage-tint); border-color: var(--sage); color: var(--sage-deep); font-weight: 600; }

  .top-distraction-card { background: var(--clay-tint); border: 1px solid var(--clay); border-radius: var(--radius-lg); padding: 18px; }
  .top-distraction-card .td-label { font-size: 11px; font-weight: 700; color: var(--clay); margin-bottom: 6px; }
  .top-distraction-card .td-name { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
  .top-distraction-card .td-sub { font-size: 12px; color: #6d332a; }

  .timer-wrap { display: flex; flex-direction: column; align-items: center; padding: 18px 0 6px; }
  .timer-digits { font-size: 44px; font-weight: 700; letter-spacing: 1px; }
  .timer-planned { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .timer-actions { display: flex; gap: 10px; width: 100%; margin-top: 22px; }
  .duration-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .duration-btn {
    padding: 20px 10px; border-radius: var(--radius-md); border: 1.5px solid var(--line); background: var(--surface);
    text-align: center; cursor: pointer;
  }
  .duration-btn .dmin { font-size: 22px; font-weight: 700; }
  .duration-btn .dlbl { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  .nav-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line);
    display: flex; justify-content: space-around; padding: 8px 2px calc(8px + env(safe-area-inset-bottom));
    z-index: 30;
  }
  .nav-btn {
    background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--ink-faint); font-size: 9.5px; font-weight: 700; cursor: pointer; padding: 3px 2px; flex: 1;
  }
  .nav-btn .nav-icon { font-size: 18px; line-height: 1; }
  .nav-btn.active { color: var(--sage-deep); }

  .sheet-overlay {
    position: fixed; inset: 0; background: rgba(35,39,31,.42); display: flex; align-items: flex-end;
    justify-content: center; z-index: 60;
  }
  .sheet {
    background: var(--surface); width: 100%; max-width: 480px; border-radius: 22px 22px 0 0; padding: 20px;
    max-height: 88vh; overflow-y: auto;
  }
  .sheet h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .sheet .sheet-sub { font-size: 12px; color: var(--ink-soft); margin-bottom: 14px; }
  .sheet-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .toast {
    position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%); background: var(--sage-deep);
    color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; z-index: 80;
    box-shadow: 0 4px 16px rgba(0,0,0,.18); opacity: 0; transition: opacity .2s, transform .2s;
    pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -6px); }

  .empty-cta { text-align: center; padding: 30px 14px; }
  .empty-cta .ec-icon { font-size: 30px; margin-bottom: 8px; }
  .empty-cta .ec-text { font-size: 13px; color: var(--ink-soft); margin-bottom: 14px; line-height: 1.6; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="brand">
    <span class="brand-mark">Focus</span>
    <span class="brand-tag">افهم تشتتك، حسّن تركيزك</span>
  </div>
  <button class="icon-btn" id="settingsBtn">⚙️</button>
</div>

<div class="app" id="app"></div>

<div class="nav-bar" id="navBar">
  <button class="nav-btn" data-tab="today"><span class="nav-icon">☀️</span>اليوم</button>
  <button class="nav-btn" data-tab="focus"><span class="nav-icon">⏱</span>تركيز</button>
  <button class="nav-btn" data-tab="distractions"><span class="nav-icon">🌀</span>تشتيت</button>
  <button class="nav-btn" data-tab="habits"><span class="nav-icon">✅</span>عادات</button>
  <button class="nav-btn" data-tab="energy"><span class="nav-icon">🔋</span>طاقة</button>
  <button class="nav-btn" data-tab="insights"><span class="nav-icon">💡</span>رؤى</button>
  <button class="nav-btn" data-tab="progress"><span class="nav-icon">📈</span>تقدم</button>
</div>

<div id="sheetRoot"></div>
<div class="toast" id="toastRoot"></div>

<script>
/* ============================== تخزين البيانات ============================== */
const STORAGE_KEY = "focusAppStateV1";

const DEFAULT_CATEGORIES = [
  { key: "phone", label: "📱 الهاتف" },
  { key: "whatsapp", label: "💬 واتساب" },
  { key: "social", label: "📲 سوشيال ميديا" },
  { key: "people", label: "🗣 أشخاص" },
  { key: "noise", label: "🔊 ضوضاء" },
  { key: "thoughts", label: "💭 أفكار" },
  { key: "task", label: "📋 مهمة تانية" },
  { key: "boredom", label: "🥱 ملل" },
  { key: "other", label: "✳️ حاجة تانية" },
];

const HABIT_PRESETS = [
  "اقرأ ١٠ دقايق", "رياضة", "اتعلم حاجة جديدة", "نام قبل ١٢",
  "من غير موبايل أول نص ساعة", "اشرب مية", "تأمل",
];

function defaultState() {
  return {
    version: 1,
    mainFocusByDate: {},
    activeSession: null,
    sessions: [],
    distractionCategories: DEFAULT_CATEGORIES.slice(),
    standaloneLogs: [],
    habits: [],
    energyLogs: {},
    weeklyReviews: [],
  };
}

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  } catch (e) {
    return defaultState();
  }
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ============================== أدوات عامة ============================== */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function dateKey(d) {
  d = d || new Date();
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function dateKeyFromISO(iso) { return dateKey(new Date(iso)); }
function todayKey() { return dateKey(new Date()); }
function last7Keys(offset) {
  offset = offset || 0;
  const arr = [];
  for (let i = 0; i < 7; i++) { const d = new Date(); d.setDate(d.getDate() - i - offset * 7); arr.push(dateKey(d)); }
  return arr;
}
function fmtMin(totalMin) {
  totalMin = Math.round(totalMin);
  const h = Math.floor(totalMin / 60), m = totalMin % 60;
  if (h <= 0) return `${m}د`;
  return `${h}س ${m}د`;
}
function fmtClock(sec) {
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}
function pctChange(cur, prev) {
  if (prev === 0) return cur === 0 ? 0 : null;
  return Math.round(((cur - prev) / prev) * 100);
}
function categoryLabel(key) {
  const c = state.distractionCategories.find((c) => c.key === key);
  return c ? c.label : "✳️ " + key;
}
function toast(msg) {
  const t = document.getElementById("toastRoot");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.classList.remove("show"), 1800);
}
function greetingWord() {
  const h = new Date().getHours();
  if (h < 5) return "تصبح على خير";
  if (h < 12) return "صباح الخير";
  if (h < 17) return "مساء الخير";
  if (h < 21) return "مساء الخير";
  return "مساء الخير";
}

/* ============================== الجلسات + سجل التشتيت ============================== */
function sessionActualMin(s) {
  if (s.actualMin != null) return s.actualMin;
  return Math.round((new Date(s.endedAt) - new Date(s.startedAt)) / 60000);
}
function sessionsInKeys(keysArr) {
  const set = new Set(keysArr);
  return state.sessions.filter((s) => set.has(dateKeyFromISO(s.startedAt)));
}
function allDistractionEventsInKeys(keysArr) {
  const set = new Set(keysArr);
  const events = [];
  state.standaloneLogs.forEach((l) => { if (set.has(dateKeyFromISO(l.at))) events.push(l); });
  state.sessions.forEach((s) => s.distractions.forEach((d) => { if (set.has(dateKeyFromISO(d.at))) events.push(d); }));
  if (state.activeSession) state.activeSession.distractions.forEach((d) => { if (set.has(dateKeyFromISO(d.at))) events.push(d); });
  return events;
}
function countBy(arr, field) {
  const out = {};
  arr.forEach((x) => { out[x[field]] = (out[x[field]] || 0) + 1; });
  return out;
}

/*
 * حساب "درجة التركيز" (Focus Score) من ٠ إلى ١٠٠ على فترة معينة (يوم أو أسبوع):
 *   ٤٠٪  إكمال الجلسات       = عدد الجلسات المكتملة / إجمالي عدد الجلسات
 *   ٢٥٪  التحكم في المقاطعات  = ١ - (متوسط عدد مرات التشتت لكل جلسة / ٥)  — يوصل للصفر عند ٥ تشتتات فأكتر في المتوسط
 *   ٢٠٪  مدة التركيز          = إجمالي دقائق التركيز الفعلية / (١٢٠ دقيقة × عدد أيام الفترة)  — الهدف اليومي المرجعي ١٢٠ دقيقة
 *   ١٥٪  الاستمرارية          = عدد الأيام اللي فيها جلسة واحدة على الأقل / عدد أيام الفترة
 * الناتج بيتقفل بين ٠ و١٠٠.
 */
function computeFocusScore(keysArr) {
  const sessions = sessionsInKeys(keysArr);
  if (sessions.length === 0) return 0;
  const completed = sessions.filter((s) => s.completed).length;
  const completionRate = completed / sessions.length;
  const totalInterruptions = sessions.reduce((a, s) => a + s.distractions.length, 0);
  const avgInterruptions = totalInterruptions / sessions.length;
  const interruptionControl = Math.max(0, 1 - avgInterruptions / 5);
  const totalMinutes = sessions.reduce((a, s) => a + sessionActualMin(s), 0);
  const durationScore = Math.min(1, totalMinutes / (120 * keysArr.length));
  const daysWithSession = new Set(sessions.map((s) => dateKeyFromISO(s.startedAt))).size;
  const consistency = daysWithSession / keysArr.length;
  const score = completionRate * 40 + interruptionControl * 25 + durationScore * 20 + consistency * 15;
  return Math.round(Math.max(0, Math.min(100, score)));
}

function habitDone(h, key) { return !!h.logs[key]; }
function habitStreak(h) {
  let streak = 0, d = new Date();
  if (!habitDone(h, dateKey(d))) d.setDate(d.getDate() - 1);
  while (habitDone(h, dateKey(d))) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}
function habitWeeklyPct(h) {
  const keys = last7Keys(0);
  const done = keys.filter((k) => habitDone(h, k)).length;
  return Math.round((done / 7) * 100);
}
function habitsAvgWeeklyPct() {
  if (state.habits.length === 0) return null;
  return Math.round(state.habits.reduce((a, h) => a + habitWeeklyPct(h), 0) / state.habits.length);
}

function avgEnergyInKeys(keysArr) {
  const vals = keysArr.map((k) => state.energyLogs[k]).filter(Boolean).map((e) => e.energy);
  if (vals.length === 0) return null;
  return Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 10) / 10;
}

/* ============================== الرؤى (Insights) ============================== */
function buildInsights() {
  const insights = [];
  const thisWeek = last7Keys(0), lastWeek = last7Keys(1);
  const thisSessions = sessionsInKeys(thisWeek), lastSessions = sessionsInKeys(lastWeek);

  if (thisSessions.length < 3) {
    insights.push({ emph: false, text: "كمّل تسجّل جلسات تركيز كذا يوم كمان، وهطلعلك ملاحظات أدق عن نمط تركيزك وتشتتك." });
    return insights;
  }

  const events = allDistractionEventsInKeys(thisWeek);
  if (events.length) {
    const counts = countBy(events, "key");
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    insights.push({ emph: true, text: `أكتر حاجة بتشتتك الأسبوع ده هي ${categoryLabel(top[0])} — ${top[1]} مرة.` });
  }

  const buckets = { morning: [], afternoon: [], evening: [] };
  thisSessions.forEach((s) => {
    const h = new Date(s.startedAt).getHours();
    const b = h < 12 ? "morning" : h < 18 ? "afternoon" : "evening";
    buckets[b].push(s);
  });
  let bestB = null, bestRate = -1;
  const labels = { morning: "الصبح", afternoon: "بعد الضهر", evening: "بالليل" };
  Object.entries(buckets).forEach(([b, list]) => {
    if (list.length >= 2) { const rate = list.filter((s) => s.completed).length / list.length; if (rate > bestRate) { bestRate = rate; bestB = b; } }
  });
  if (bestB) insights.push({ emph: false, text: `تركيزك بيبقى أحسن وبتكمّل جلسات أكتر ${labels[bestB]}.` });

  if (lastSessions.length > 0 && thisSessions.length !== lastSessions.length) {
    const up = thisSessions.length > lastSessions.length;
    insights.push({ emph: false, text: `عدد جلسات التركيز ${up ? "زاد" : "قل"} من ${lastSessions.length} لـ ${thisSessions.length} عن الأسبوع اللي فات.` });
  }

  const avgDur = (list) => (list.length ? Math.round(list.reduce((a, s) => a + sessionActualMin(s), 0) / list.length) : 0);
  const thisAvg = avgDur(thisSessions), lastAvg = avgDur(lastSessions);
  if (lastAvg > 0 && thisAvg !== lastAvg) {
    insights.push({ emph: false, text: `متوسط جلسة التركيز ${thisAvg > lastAvg ? "زاد" : "قل"} من ${lastAvg} دقيقة لـ ${thisAvg} دقيقة.` });
  }

  const thisInt = thisSessions.reduce((a, s) => a + s.distractions.length, 0);
  const lastInt = lastSessions.reduce((a, s) => a + s.distractions.length, 0);
  if (lastInt > 0) {
    const pct = Math.round(((lastInt - thisInt) / lastInt) * 100);
    if (pct !== 0) insights.push({ emph: pct > 0, text: pct > 0 ? `عدد مرات التشتت قل ${pct}% عن الأسبوع اللي فات — أحسنت.` : `عدد مرات التشتت زاد ${Math.abs(pct)}% عن الأسبوع اللي فات.` });
  }

  const energyDays = thisWeek.concat(lastWeek).filter((k) => state.energyLogs[k]);
  const highDays = energyDays.filter((k) => state.energyLogs[k].energy >= 7);
  const lowDays = energyDays.filter((k) => state.energyLogs[k].energy < 7);
  if (highDays.length >= 2 && lowDays.length >= 2) {
    const highScore = computeFocusScore(highDays), lowScore = computeFocusScore(lowDays);
    if (highScore > lowScore) {
      const pct = lowScore > 0 ? Math.round(((highScore - lowScore) / lowScore) * 100) : null;
      insights.push({ emph: false, text: pct ? `تركيزك بيبقى أحسن بحوالي ${pct}% لما طاقتك فوق ٧ من ١٠.` : `تركيزك بيبقى أوضح لما طاقتك فوق ٧ من ١٠.` });
    }
  }

  const habitPct = habitsAvgWeeklyPct();
  if (habitPct != null && habitPct >= 70) insights.push({ emph: true, text: `ثباتك في العادات ممتاز الأسبوع ده — ${habitPct}%.` });

  if (insights.length === 0) insights.push({ emph: false, text: "بياناتك لسه متقاربة من أسبوع لأسبوع — كمّل واظب وهتبان الأنماط أوضح." });
  return insights;
}

function buildRecommendations() {
  const recs = [];
  const thisWeek = last7Keys(0), lastWeek = last7Keys(1);
  const events = allDistractionEventsInKeys(thisWeek), lastEvents = allDistractionEventsInKeys(lastWeek);
  const screenKeys = ["phone", "whatsapp", "social"];
  const screenCount = events.filter((e) => screenKeys.includes(e.key)).length;
  const lastScreenCount = lastEvents.filter((e) => screenKeys.includes(e.key)).length;
  if (lastScreenCount > 0 && screenCount > lastScreenCount) {
    recs.push("تشتت الموبايل زاد الأسبوع ده — جرّب جلسة تركيز واحدة وهاتفك في وضع الطيران أو في أوضة تانية.");
  }
  const thisSessions = sessionsInKeys(thisWeek);
  const buckets = { morning: [], afternoon: [], evening: [] };
  thisSessions.forEach((s) => { const h = new Date(s.startedAt).getHours(); const b = h < 12 ? "morning" : h < 18 ? "afternoon" : "evening"; buckets[b].push(s); });
  const morningRate = buckets.morning.length >= 2 ? buckets.morning.filter((s) => s.completed).length / buckets.morning.length : null;
  const otherRates = ["afternoon", "evening"].map((b) => (buckets[b].length >= 2 ? buckets[b].filter((s) => s.completed).length / buckets[b].length : null)).filter((x) => x != null);
  if (morningRate != null && otherRates.every((r) => morningRate >= r)) {
    recs.push("تركيزك في الصبح أعلى من باقي اليوم — حاول تحجز أهم مهمة في اليوم في أول ساعتين بعد ما تصحى.");
  }
  const stoppedEarly = thisSessions.filter((s) => !s.completed).length;
  if (thisSessions.length >= 4 && stoppedEarly / thisSessions.length > 0.4) {
    recs.push("جزء كبير من جلساتك بتتقفل قبل ما تخلص وقتها — جرّب تبدأ بمدة أقصر (١٥ دقيقة) وتزوّد تدريجي.");
  }
  if (recs.length === 0) recs.push("كمّل على نفس الاستمرارية — البيانات لسه بتتجمع عشان أقدر أقترحلك حاجة أدق.");
  return recs.slice(0, 3);
}

/* ============================== منطق جلسة التركيز ============================== */
function startFocusSession(minutes) {
  state.activeSession = { id: uid(), plannedMin: minutes, startedAt: new Date().toISOString(), pausedAccumMs: 0, pausedAt: null, status: "running", distractions: [] };
  saveState();
  render();
}
function sessionElapsedMs(s) {
  const now = s.status === "paused" ? new Date(s.pausedAt).getTime() : Date.now();
  return now - new Date(s.startedAt).getTime() - (s.pausedAccumMs || 0);
}
function toggleSessionPause() {
  const s = state.activeSession; if (!s) return;
  if (s.status === "running") { s.status = "paused"; s.pausedAt = new Date().toISOString(); }
  else { s.pausedAccumMs = (s.pausedAccumMs || 0) + (Date.now() - new Date(s.pausedAt).getTime()); s.pausedAt = null; s.status = "running"; }
  saveState(); render();
}
function finishSession(completed) {
  const s = state.activeSession; if (!s) return;
  const endedAt = new Date().toISOString();
  const actualMin = Math.max(0, Math.round(sessionElapsedMs(s) / 60000));
  const finished = { id: s.id, plannedMin: s.plannedMin, startedAt: s.startedAt, endedAt, actualMin, completed, distractions: s.distractions };
  state.sessions.push(finished);
  state.activeSession = null;
  saveState();
  showSessionSummary(finished);
}
function showSessionSummary(s) {
  const counts = countBy(s.distractions, "key");
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  const score = s.completed ? Math.max(0, 100 - s.distractions.length * 12) : Math.max(0, 60 - s.distractions.length * 12);
  openSheet(`
    <h3>${s.completed ? "خلصت الجلسة 🎉" : "الجلسة اتوقفت"}</h3>
    <div class="sheet-sub">كده تسجّل عندك في السجل</div>
    <div class="kv-row"><span class="kv-label">مدة التركيز الفعلية</span><span class="kv-val">${fmtMin(s.actualMin)}</span></div>
    <div class="kv-row"><span class="kv-label">عدد مرات التشتت</span><span class="kv-val">${s.distractions.length}</span></div>
    <div class="kv-row"><span class="kv-label">أكتر تشتيت</span><span class="kv-val">${top ? categoryLabel(top[0]) : "—"}</span></div>
    <div class="kv-row"><span class="kv-label">تقييم الجلسة</span><span class="kv-val">${score}/100</span></div>
    <button class="btn-primary" id="closeSummaryBtn" style="margin-top:14px;">تمام</button>
  `);
  document.getElementById("closeSummaryBtn").onclick = () => { closeSheet(); render(); };
  render();
}
function startTimerLoop() {
  if (timerInterval) return;
  timerInterval = setInterval(() => {
    const s = state.activeSession;
    if (!s) return;
    if (s.status === "running") {
      const remaining = s.plannedMin * 60000 - sessionElapsedMs(s);
      if (remaining <= 0) { finishSession(true); return; }
    }
    if (currentTab === "focus") updateTimerDOM();
  }, 1000);
}
function updateTimerDOM() {
  const s = state.activeSession; if (!s) return;
  const remaining = Math.max(0, s.plannedMin * 60000 - sessionElapsedMs(s));
  const digitsEl = document.getElementById("timerDigits");
  const ringEl = document.getElementById("timerRing");
  if (digitsEl) digitsEl.textContent = fmtClock(remaining / 1000);
  if (ringEl) {
    const pct = Math.min(100, (1 - remaining / (s.plannedMin * 60000)) * 100);
    ringEl.style.setProperty("--pct", pct);
  }
}

    <div class="chip-row">
      ${HABIT_PRESETS.map((p) => `<button class="chip" data-preset="${escapeHtml(p)}">${p}</button>`).join("")}
      <button class="chip chip-add" id="customHabitBtn">+ عادة جديدة</button>
    </div>
  `;
  wireHabitRows(today);
  document.querySelectorAll("[data-delhabit]").forEach((btn) => {
    btn.onclick = () => { if (confirm("تمسح العادة دي؟")) { state.habits = state.habits.filter((h) => h.id !== btn.dataset.delhabit); saveState(); render(); } };
  });
  document.querySelectorAll("[data-preset]").forEach((btn) => {
    btn.onclick = () => {
      if (state.habits.some((h) => h.name === btn.dataset.preset)) { toast("العادة دي موجودة أصلاً"); return; }
      state.habits.push({ id: uid(), name: btn.dataset.preset, note: "", logs: {}, createdAt: new Date().toISOString() });
      saveState(); toast("اتضافت"); render();
    };
  });
  document.getElementById("customHabitBtn").onclick = () => {
    openSheet(`
      <h3>عادة جديدة</h3>
      <div class="field-label">اسم العادة</div>
      <input class="text-input" id="newHabitName" placeholder="مثلاً: مذاكرة ٣٠ دقيقة" />
      <div class="field-label">ملاحظة (اختياري)</div>
      <input class="text-input" id="newHabitNote" placeholder="مثلاً: قبل النوم" />
      <button class="btn-primary" id="saveHabitBtn" style="margin-top:14px;">حفظ</button>
    `);
    document.getElementById("saveHabitBtn").onclick = () => {
      const name = document.getElementById("newHabitName").value.trim();
      if (!name) { toast("اكتب اسم العادة"); return; }
      state.habits.push({ id: uid(), name, note: document.getElementById("newHabitNote").value.trim(), logs: {}, createdAt: new Date().toISOString() });
      saveState(); closeSheet(); render();
    };
  };
}

/* ============================== شاشة: طاقة ============================== */
function renderEnergy(app) {
  const today = todayKey();
  const cur = state.energyLogs[today] || { energy: null, mood: null, stress: null, sleep: null };
  const weekKeys = last7Keys(0).slice().reverse();
  const maxE = 10;

  app.innerHTML = `
    <div class="card">
      <div class="field-label" style="margin-top:0;">مستوى طاقتك دلوقتي (من ١ لـ ١٠)</div>
      <div class="scale-row" id="energyScale">
        ${Array.from({ length: 10 }, (_, i) => i + 1).map((n) => `<button class="scale-btn ${cur.energy === n ? "sel" : ""}" data-e="${n}">${n}</button>`).join("")}
      </div>
      <div class="field-label">المزاج (اختياري)</div>
      <div class="scale-row" id="moodScale">
        ${["😣", "🙁", "😐", "🙂", "😄"].map((em, i) => `<button class="scale-btn ${cur.mood === i ? "sel" : ""}" data-m="${i}" style="font-size:16px;">${em}</button>`).join("")}
      </div>
      <div class="field-label">التوتر (اختياري، من ١ لـ ١٠)</div>
      <div class="scale-row" id="stressScale">
        ${[2, 4, 6, 8, 10].map((n) => `<button class="scale-btn ${cur.stress === n ? "sel" : ""}" data-s="${n}">${n}</button>`).join("")}
      </div>
      <div class="field-label">عدد ساعات النوم (اختياري)</div>
      <input class="num-input" type="number" min="0" max="14" step="0.5" id="sleepInput" placeholder="مثلاً: ٧" value="${cur.sleep != null ? cur.sleep : ""}" />
      <button class="btn-primary" id="saveEnergyBtn" style="margin-top:14px;">حفظ طاقة النهاردة</button>
    </div>

    <div class="section-title">آخر ٧ أيام</div>
    <div class="card">
      <div class="bars-wrap">
        ${weekKeys.map((k) => {
          const e = state.energyLogs[k];
          const v = e ? e.energy : 0;
          const d = new Date(k);
          const lbl = ["أحد", "اتنين", "تلات", "أربع", "خميس", "جمعة", "سبت"][d.getDay()];
          return `<div class="bar-col"><div class="bar-val">${e ? e.energy : "-"}</div><div class="bar-fill" style="height:${Math.max((v / maxE) * 100, e ? 6 : 2)}%; ${!e ? "background:var(--line);" : ""}"></div><div class="bar-lbl">${lbl}</div></div>`;
        }).join("")}
      </div>
    </div>
  `;

  let sel = { energy: cur.energy, mood: cur.mood, stress: cur.stress };
  document.querySelectorAll("#energyScale [data-e]").forEach((b) => b.onclick = () => { sel.energy = Number(b.dataset.e); refreshScaleUI(); });
  document.querySelectorAll("#moodScale [data-m]").forEach((b) => b.onclick = () => { sel.mood = Number(b.dataset.m); refreshScaleUI(); });
  document.querySelectorAll("#stressScale [data-s]").forEach((b) => b.onclick = () => { sel.stress = Number(b.dataset.s); refreshScaleUI(); });
  function refreshScaleUI() {
    document.querySelectorAll("#energyScale [data-e]").forEach((b) => b.classList.toggle("sel", Number(b.dataset.e) === sel.energy));
    document.querySelectorAll("#moodScale [data-m]").forEach((b) => b.classList.toggle("sel", Number(b.dataset.m) === sel.mood));
    document.querySelectorAll("#stressScale [data-s]").forEach((b) => b.classList.toggle("sel", Number(b.dataset.s) === sel.stress));
  }
  document.getElementById("saveEnergyBtn").onclick = () => {
    if (sel.energy == null) { toast("اختار مستوى الطاقة الأول"); return; }
    const sleepVal = document.getElementById("sleepInput").value;
    state.energyLogs[today] = { energy: sel.energy, mood: sel.mood, stress: sel.stress, sleep: sleepVal ? Number(sleepVal) : null, at: new Date().toISOString() };
    saveState(); toast("اتسجلت طاقة النهاردة"); render();
  };
}

/* ============================== شاشة: رؤى ============================== */
function renderInsights(app) {
  const insights = buildInsights();
  app.innerHTML = `
    <div class="section-title">ملاحظات عن نمطك</div>
    ${insights.map((i) => `<div class="insight-card ${i.emph ? "emph" : ""}">${i.text}</div>`).join("")}
    <div class="section-title">اقتراحات</div>
    ${buildRecommendations().map((r) => `<div class="insight-card">💡 ${r}</div>`).join("")}
  `;
}

/* ============================== شاشة: تقدم ============================== */
function renderProgress(app) {
  const thisWeek = last7Keys(0), lastWeek = last7Keys(1);
  const thisSessions = sessionsInKeys(thisWeek), lastSessions = sessionsInKeys(lastWeek);
  const thisFocusMin = thisSessions.reduce((a, s) => a + sessionActualMin(s), 0);
  const lastFocusMin = lastSessions.reduce((a, s) => a + sessionActualMin(s), 0);
  const thisDist = allDistractionEventsInKeys(thisWeek).length;
  const lastDist = allDistractionEventsInKeys(lastWeek).length;
  const thisAvgDur = thisSessions.length ? Math.round(thisFocusMin / thisSessions.length) : 0;
  const lastAvgDur = lastSessions.length ? Math.round(lastFocusMin / lastSessions.length) : 0;
  const habitPct = habitsAvgWeeklyPct();
  const thisEnergy = avgEnergyInKeys(thisWeek), lastEnergy = avgEnergyInKeys(lastWeek);
  const score = computeFocusScore(thisWeek);
  const growth = Math.round(score * 0.4 + (habitPct || 0) * 0.3 + ((thisEnergy || 0) / 10) * 100 * 0.3);

  function trendHtml(cur, prev, inverse) {
    if (prev == null || prev === 0) return `<span class="trend-flat">—</span>`;
    const pct = pctChange(cur, prev);
    if (pct == null || pct === 0) return `<span class="trend-flat">بدون تغيير</span>`;
    const good = inverse ? pct < 0 : pct > 0;
    return `<span class="${good ? "trend-up" : "trend-down"}">${pct > 0 ? "↑" : "↓"} ${Math.abs(pct)}%</span>`;
  }

  app.innerHTML = `
    <div class="card">
      <div class="score-row">
        <div class="ring" style="--pct:${score}; width:84px; height:84px; background: conic-gradient(var(--sage) calc(var(--pct)*3.6deg), var(--line) 0deg);">
          <div class="ring-inner"><div class="ring-num">${score}</div><div class="ring-cap">تركيز</div></div>
        </div>
        <div>
          <div class="score-text-title">درجة التركيز — الأسبوع ده</div>
          <div class="score-text-desc">من إكمال الجلسات، التحكم في المقاطعات، مدة التركيز، والاستمرارية.</div>
        </div>
      </div>
    </div>

    <div class="section-title">هذا الأسبوع مقابل اللي فات</div>
    <div class="card">
      <div class="kv-row"><span class="kv-label">وقت التركيز</span><span class="kv-val">${fmtMin(thisFocusMin)} ${trendHtml(thisFocusMin, lastFocusMin, false)}</span></div>
      <div class="kv-row"><span class="kv-label">جلسات مكتملة</span><span class="kv-val">${thisSessions.filter(s=>s.completed).length} ${trendHtml(thisSessions.filter(s=>s.completed).length, lastSessions.filter(s=>s.completed).length, false)}</span></div>
      <div class="kv-row"><span class="kv-label">متوسط الجلسة</span><span class="kv-val">${thisAvgDur}د ${trendHtml(thisAvgDur, lastAvgDur, false)}</span></div>
      <div class="kv-row"><span class="kv-label">مرات التشتت</span><span class="kv-val">${thisDist} ${trendHtml(thisDist, lastDist, true)}</span></div>
      <div class="kv-row"><span class="kv-label">إكمال العادات</span><span class="kv-val">${habitPct != null ? habitPct + "%" : "—"}</span></div>
      <div class="kv-row"><span class="kv-label">متوسط الطاقة</span><span class="kv-val">${thisEnergy != null ? thisEnergy + "/١٠" : "—"} ${trendHtml(thisEnergy || 0, lastEnergy || 0, false)}</span></div>
    </div>

    <div class="section-title">درجة النمو الشخصي</div>
    <div class="card">
      <div class="score-row">
        <div class="ring" style="--pct:${growth}; width:64px; height:64px; background: conic-gradient(var(--ochre) calc(var(--pct)*3.6deg), var(--line) 0deg);">
          <div class="ring-inner"><div class="ring-num" style="font-size:16px;">${growth}</div></div>
        </div>
        <div class="score-text-desc" style="flex:1;">مجموع موزون من التركيز، العادات، والطاقة — مؤشر عام على تطورك الأسبوع ده.</div>
      </div>
    </div>

    <div class="section-title">مراجعة أسبوعية</div>
    <button class="btn-secondary" id="startReviewBtn">📝 ابدأ مراجعة الأسبوع</button>
    ${state.weeklyReviews.length ? `
      <div class="card" style="margin-top:12px;">
        ${state.weeklyReviews.slice().reverse().slice(0, 3).map((r) => `
          <div style="margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--line);">
            <div style="font-weight:700; font-size:13px; margin-bottom:4px;">${new Date(r.createdAt).toLocaleDateString("ar-EG")}</div>
            <div class="muted" style="font-size:12.5px; line-height:1.6;">${escapeHtml(r.summary)}</div>
            <div style="font-size:12.5px; margin-top:6px; color:var(--ochre); font-weight:700;">🎯 ${escapeHtml(r.challenge)}</div>
          </div>
        `).join("")}
      </div>` : ""}
  `;
  document.getElementById("startReviewBtn").onclick = openWeeklyReviewSheet;
}

function openWeeklyReviewSheet() {
  openSheet(`
    <h3>مراجعة الأسبوع</h3>
    <div class="sheet-sub">إجابتك بتساعد في ملخص الأسبوع الجاي</div>
    <div class="field-label" style="margin-top:0;">١. إيه اللي شتتك أكتر؟</div>
    <input class="text-input" id="rq1" />
    <div class="field-label">٢. امتى كنت أكتر تركيز؟</div>
    <input class="text-input" id="rq2" />
    <div class="field-label">٣. انهي عادة حسّت إنها اتحسنت؟</div>
    <input class="text-input" id="rq3" />
    <div class="field-label">٤. عايز تحسن إيه الأسبوع الجاي؟</div>
    <input class="text-input" id="rq4" />
    <button class="btn-primary" id="submitReviewBtn" style="margin-top:14px;">إنشاء الملخص</button>
  `);
  document.getElementById("submitReviewBtn").onclick = () => {
    const answers = {
      q1: document.getElementById("rq1").value.trim(),
      q2: document.getElementById("rq2").value.trim(),
      q3: document.getElementById("rq3").value.trim(),
      q4: document.getElementById("rq4").value.trim(),
    };
    const thisWeek = last7Keys(0);
    const sessions = sessionsInKeys(thisWeek);
    const events = allDistractionEventsInKeys(thisWeek);
    const counts = countBy(events, "key");
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    const scoreThis = computeFocusScore(thisWeek), scoreLast = computeFocusScore(last7Keys(1));
    const diff = pctChange(scoreThis, scoreLast);
    const summary = `خلصت ${sessions.filter((s) => s.completed).length} جلسة تركيز الأسبوع ده.` +
      (top ? ` أكتر حاجة شتتتك كانت ${categoryLabel(top[0])}.` : "") +
      (diff != null && diff !== 0 ? ` درجة تركيزك ${diff > 0 ? "اتحسنت" : "قلت"} ${Math.abs(diff)}%.` : "");
    const challenge = top ? `قلل تشتيت ${categoryLabel(top[0])} بنسبة ٢٠٪ الأسبوع الجاي.` : (answers.q4 || "حافظ على نفس الاستمرارية الأسبوع الجاي.");
    state.weeklyReviews.push({ id: uid(), createdAt: new Date().toISOString(), answers, summary, challenge });
    saveState(); closeSheet(); render();
  };
}

/* ============================== الإعدادات (نسخ احتياطي) ============================== */
function openSettingsSheet() {
  openSheet(`
    <h3>الإعدادات</h3>
    <div class="field-label" style="margin-top:0;">اسمك (اختياري، للترحيب بس)</div>
    <input class="text-input" id="userNameInput" value="${escapeHtml(state.userName || "")}" placeholder="مثلاً: محمد" />
    <button class="btn-secondary" id="saveNameBtn" style="margin-top:8px;">حفظ الاسم</button>

    <div class="field-label">النسخ الاحتياطي</div>
    <div class="btn-row">
      <button class="btn-secondary" id="exportBtn">⬇ تصدير نسخة</button>
      <button class="btn-secondary" id="importBtnTrigger">⬆ استيراد نسخة</button>
    </div>
    <input type="file" id="importFileInput" accept="application/json" style="display:none;" />

    <div class="field-label">منطقة الخطر</div>
    <button class="btn-secondary btn-danger" id="resetAllBtn">🗑 مسح كل البيانات</button>
  `);
  document.getElementById("saveNameBtn").onclick = () => {
    state.userName = document.getElementById("userNameInput").value.trim();
    saveState(); toast("اتحفظ"); closeSheet(); render();
  };
  document.getElementById("exportBtn").onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `focus-backup-${todayKey()}.json`; a.click();
    URL.revokeObjectURL(url);
  };
  document.getElementById("importBtnTrigger").onclick = () => document.getElementById("importFileInput").click();
  document.getElementById("importFileInput").onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        state = Object.assign(defaultState(), parsed);
        saveState(); toast("اتسترجعت البيانات"); closeSheet(); render();
      } catch (err) { toast("الملف مش صالح"); }
    };
    reader.readAsText(file);
  };
  document.getElementById("resetAllBtn").onclick = () => {
    if (confirm("متأكد؟ هيتمسح كل بياناتك من غير رجعة.")) {
      state = defaultState(); saveState(); closeSheet(); render();
    }
  };
}

/* ============================== التهيئة ============================== */
function render() {
  document.querySelectorAll(".nav-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === currentTab));
  const app = document.getElementById("app");
  if (currentTab === "today") renderToday(app);
  else if (currentTab === "focus") renderFocus(app);
  else if (currentTab === "distractions") renderDistractions(app);
  else if (currentTab === "habits") renderHabits(app);
  else if (currentTab === "energy") renderEnergy(app);
  else if (currentTab === "insights") renderInsights(app);
  else if (currentTab === "progress") renderProgress(app);
}

document.querySelectorAll(".nav-btn").forEach((b) => b.addEventListener("click", () => switchTab(b.dataset.tab)));
document.getElementById("settingsBtn").addEventListener("click", openSettingsSheet);

startTimerLoop();
render();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
</body>
</html>
