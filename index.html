<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Focus (أوفلاين)</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#0B2545" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<style>
  :root {
    --navy: #0B2545;
    --navy-2: #12395F;
    --turq: #17C3B2;
    --amber: #F2A93B;
    --line: #E3E9F0;
    --muted: #64748B;
    --bg: #F5F7FA;
    --red: #B5473A;
    --green-ok: #1E7A46;
    --yellow-ok: #C9581E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Tahoma', 'Segoe UI', sans-serif; background: var(--bg);
    color: var(--navy); padding-bottom: 90px; -webkit-tap-highlight-color: transparent;
  }
  .top-bar {
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
    color: #fff; padding: 16px 18px 20px; display: flex; justify-content: space-between; align-items: center;
  }
  .top-bar h1 { font-size: 20px; margin: 0; font-weight: 800; }
  .profile-chip {
    background: rgba(255,255,255,.15); border: none; color: #fff; padding: 7px 14px;
    border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .container { padding: 16px; max-width: 480px; margin: 0 auto; }
  .section-label { font-size: 12px; font-weight: 700; color: var(--muted); margin: 18px 0 8px; }
  .active-card {
    background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px;
    box-shadow: 0 2px 12px rgba(11,37,69,.06);
  }
  .active-card .empty-msg { text-align: center; color: var(--muted); padding: 18px 0; font-size: 14px; }
  .active-note { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .active-meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .active-actions { display: flex; gap: 10px; }
  .active-actions button {
    flex: 1; padding: 10px; border-radius: 10px; border: 1.5px solid var(--line);
    background: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .btn-park { color: var(--yellow-ok); border-color: var(--yellow-ok) !important; }
  .btn-done { color: var(--green-ok); border-color: var(--green-ok) !important; }

  .task-row {
    display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; margin-bottom: 8px; cursor: pointer;
  }
  .task-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .task-note { flex: 1; font-size: 14px; font-weight: 600; }
  .task-sub { font-size: 11px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 18px 0; }

  .fab-row {
    position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--line);
    display: flex; justify-content: center; padding: 10px 0; box-shadow: 0 -2px 10px rgba(11,37,69,.06);
  }
  .fab {
    width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--turq), var(--navy-2));
    color: #fff; font-size: 28px; border: none; box-shadow: 0 4px 14px rgba(23,195,178,.4); cursor: pointer;
  }
  .panic-btn {
    position: fixed; bottom: 14px; left: 16px; background: #fff; border: 1.5px solid var(--red); color: var(--red);
    border-radius: 999px; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer;
  }

  .sheet-overlay {
    position: fixed; inset: 0; background: rgba(11,37,69,.4); display: flex; align-items: flex-end; z-index: 50;
  }
  .sheet {
    background: #fff; width: 100%; border-radius: 20px 20px 0 0; padding: 18px; max-height: 85vh; overflow-y: auto;
  }
  .sheet h3 { margin: 0 0 12px; font-size: 16px; }
  .sheet textarea, .sheet input {
    width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; font-size: 14px;
    margin-bottom: 10px; font-family: inherit;
  }
  .urgency-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .urgency-row button {
    flex: 1; padding: 9px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff;
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .urgency-row button.sel-now { background: #B5473A1a; border-color: var(--red); color: var(--red); }
  .urgency-row button.sel-next { background: #C9581E1a; border-color: var(--yellow-ok); color: var(--yellow-ok); }
  .urgency-row button.sel-later { background: #1E7A461a; border-color: var(--green-ok); color: var(--green-ok); }

  .refill-toggle { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; cursor: pointer; }
  .refill-circle { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); }
  .refill-circle.on { background: var(--turq); border-color: var(--turq); }
  .refill-fields { display: none; }
  .refill-fields.show { display: block; }

  .sheet-btn {
    width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--navy-2); color: #fff;
    font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 4px;
  }
  .cancel-btn { background: none; color: var(--muted); font-weight: 600; border: none; padding: 10px; width: 100%; cursor: pointer; }

  .profile-list-item {
    display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1.5px solid var(--line);
    border-radius: 10px; margin-bottom: 8px; cursor: pointer; font-weight: 700;
  }
  .profile-list-item.current { border-color: var(--turq); background: #17C3B21a; }
  .del-x { color: var(--red); font-size: 18px; padding: 4px 8px; }

  /* ===== Tabs + Manager page ===== */
  .tabs-row { display: flex; background: #fff; border-bottom: 1px solid var(--line); }
  .tab-btn {
    flex: 1; padding: 12px; border: none; background: none; font-weight: 700; font-size: 14px;
    color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent;
  }
  .tab-btn.active { color: var(--navy); border-bottom-color: var(--turq); }
  .mgr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .mgr-card {
    background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 10px;
    text-align: center; cursor: pointer; font-weight: 700; font-size: 13px;
  }
  .mgr-card .mgr-icon { font-size: 24px; display: block; margin-bottom: 6px; }
  .mgr-back { background: none; border: none; color: var(--navy-2); font-weight: 700; font-size: 14px; cursor: pointer; padding: 10px 0; }
  .mgr-list-item {
    background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 8px;
  }
  .mgr-list-item .row1 { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; }
  .mgr-list-item .row2 { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .mgr-add-btn {
    width: 100%; padding: 12px; border-radius: 10px; border: 1.5px dashed var(--turq); color: var(--navy-2);
    background: #17C3B20d; font-weight: 700; margin: 14px 0; cursor: pointer;
  }
  .mgr-search { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 12px; font-family: inherit; }
  .file-download-link { color: var(--navy-2); font-weight: 700; font-size: 13px; text-decoration: none; }
</style>
</head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<body>

<div class="top-bar">
  <h1>Focus</h1>
  <div style="display:flex; gap:8px;">
    <button class="profile-chip" id="importBtn">⬇ استيراد</button>
    <button class="profile-chip" id="profileChip">👤 ...</button>
  </div>
</div>

<div class="tabs-row">
  <button class="tab-btn active" id="tabTasksBtn">المهام</button>
  <button class="tab-btn" id="tabManagerBtn">الإداريات</button>
  <button class="tab-btn" id="tabCategoryBtn">Category</button>
</div>

<div id="tasksPage">
<div class="container">
  <div style="display:flex; gap:8px; margin-bottom:10px;">
    <input class="mgr-search" id="taskSearchBox" placeholder="بحث في المهام..." style="margin:0; flex:1;" />
    <button class="mgr-add-btn" id="exportTasksBtn" style="width:auto; margin:0; padding:0 14px; white-space:nowrap;">📤 تصدير</button>

    <div class="section-label">خلصت النهاردة</div>
    <div id="doneList"></div>
  </div>
</div>

<button class="panic-btn" id="panicBtn">⚡ Panic Mode</button>
<div class="fab-row"><button class="fab" id="addBtn">+</button></div>
</div>

<div id="managerPage" style="display:none">
  <div class="container" id="managerContainer"></div>
</div>

<div id="categoryPage" style="display:none">
  <div class="container" id="categoryContainer"></div>
</div>

<div id="sheetRoot"></div>

<script>
// ============ التخزين المحلي (كل حاجة هنا جوه الجهاز بس - مفيش سيرفر خالص) ============
const STORE_KEY = "focus_offline_v1";

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (!parsed.managerByProfile) parsed.managerByProfile = {};
      return parsed;
    }
  } catch (e) {}
  return { profiles: [], currentProfileId: null, tasksByProfile: {}, managerByProfile: {} };
}
function saveStore() { localStorage.setItem(STORE_KEY, JSON.stringify(store)); }

let store = loadStore();

function currentTasks() {
  if (!store.currentProfileId) return [];
  if (!store.tasksByProfile[store.currentProfileId]) store.tasksByProfile[store.currentProfileId] = [];
  return store.tasksByProfile[store.currentProfileId];
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

// ============ IndexedDB - لتخزين ملفات كبيرة (Stock/Sales/Category) بعيدًا عن localStorage المحدود ============
const IDB_NAME = "focusOfflineBigData";
const IDB_STORE = "kv";
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, value) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function idbDelete(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// ============ تصدير CSV عام ============
function downloadCSV(filename, headers, rows) {
  const esc = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const lines = [headers.map(esc).join(",")];
  rows.forEach((r) => lines.push(headers.map((h) => esc(r[h])).join(",")));
  const csv = "\uFEFF" + lines.join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

let taskFilterText = "";

// ============ البروفايلات (تفرقة بسيطة بين اللي بيستخدموا نفس الجهاز - من غير باسورد حقيقي) ============
function ensureProfile() {
  if (store.profiles.length === 0) {
    const name = prompt("اسمك إيه؟ (عشان لو حد تاني استخدم نفس الجهاز، مهامكم متتلخبطش)") || "مستخدم";
    const p = { id: uid(), name };
    store.profiles.push(p);
    store.currentProfileId = p.id;
    saveStore();
  }
  if (!store.currentProfileId) store.currentProfileId = store.profiles[0].id;
}
ensureProfile();

function currentProfileName() {
  const p = store.profiles.find((x) => x.id === store.currentProfileId);
  return p ? p.name : "؟";
}

document.getElementById("profileChip").onclick = openProfileSheet;

function openProfileSheet() {
  const sheetRoot = document.getElementById("sheetRoot");
  sheetRoot.innerHTML = `
    <div class="sheet-overlay" id="overlay">
      <div class="sheet">
        <h3>مين بيستخدم الجهاز دلوقتي؟</h3>
        <div id="profileItems"></div>
        <input type="text" id="newProfileName" placeholder="إضافة اسم جديد" />
        <button class="sheet-btn" id="addProfileBtn">إضافة</button>
        <button class="cancel-btn" id="closeProfileSheet">إغلاق</button>
      </div>
    </div>`;
  const itemsEl = document.getElementById("profileItems");
  itemsEl.innerHTML = store.profiles
    .map(
      (p) => `
    <div class="profile-list-item ${p.id === store.currentProfileId ? "current" : ""}" data-pid="${p.id}">
      <span>${escapeHtml(p.name)}</span>
      ${store.profiles.length > 1 ? `<span class="del-x" data-del="${p.id}">✕</span>` : ""}
    </div>`
    )
    .join("");
  itemsEl.querySelectorAll("[data-pid]").forEach((el) => {
    el.onclick = (e) => {
      if (e.target.dataset.del) return;
      store.currentProfileId = el.dataset.pid;
      saveStore();
      closeSheet();
      renderAll();
    };
  });
  itemsEl.querySelectorAll("[data-del]").forEach((el) => {
    el.onclick = (e) => {
      e.stopPropagation();
      if (!confirm("متأكد؟ هتتمسح مهام الشخص ده من الجهاز ده.")) return;
      const pid = el.dataset.del;
      store.profiles = store.profiles.filter((p) => p.id !== pid);
      delete store.tasksByProfile[pid];
      if (store.currentProfileId === pid) store.currentProfileId = store.profiles[0]?.id || null;
      saveStore();
      openProfileSheet();
      renderAll();
    };
  });
  document.getElementById("addProfileBtn").onclick = () => {
    const name = document.getElementById("newProfileName").value.trim();
    if (!name) return;
    const p = { id: uid(), name };
    store.profiles.push(p);
    store.currentProfileId = p.id;
    saveStore();
    closeSheet();
    renderAll();
  };
  document.getElementById("closeProfileSheet").onclick = closeSheet;
  document.getElementById("overlay").onclick = (e) => {
    if (e.target.id === "overlay") closeSheet();
  };
}

// ============ استيراد المهام من التطبيق القديم (Focus / Railway) ============
// خطوات الاستخدام: افتح التطبيق القديم في المتصفح وسجل دخولك، وبعدين روح على
// الرابط: <رابط التطبيق>/api/tasks (في نفس التبويب) - هتظهر لك بيانات JSON خام،
// انسخها كلها والصقها في الصندوق اللي هيفتح هنا.
const OLD_URGENCY_MAP = { now: "now", later: "next", end_shift: "later" };
document.getElementById("importBtn").onclick = openImportSheet;

function openImportSheet() {
  const sheetRoot = document.getElementById("sheetRoot");
  sheetRoot.innerHTML = `
    <div class="sheet-overlay" id="overlay">
      <div class="sheet">
        <h3>استيراد المهام من التطبيق القديم</h3>
        <p style="font-size:13px; color:var(--muted); margin-top:0;">
          افتح التطبيق القديم وسجل دخولك، وبعدين روح على الرابط
          <b>/api/tasks</b> (بعد رابط التطبيق) في نفس التبويب - هيظهرلك نص JSON.
          انسخه كله والصقه هنا تحت.
        </p>
        <textarea id="importText" rows="6" placeholder="الصق نص JSON هنا"></textarea>
        <button class="sheet-btn" id="runImportBtn">استيراد</button>
        <button class="cancel-btn" id="closeImportSheet">إلغاء</button>
        <p id="importResult" style="font-size:13px; margin-top:8px;"></p>
      </div>
    </div>`;
  document.getElementById("closeImportSheet").onclick = closeSheet;
  document.getElementById("overlay").onclick = (e) => { if (e.target.id === "overlay") closeSheet(); };
  document.getElementById("runImportBtn").onclick = () => {
    const raw = document.getElementById("importText").value.trim();
    const resultEl = document.getElementById("importResult");
    if (!raw) { resultEl.textContent = "محتاج تلصق نص JSON الأول."; return; }
    let oldTasks;
    try {
      oldTasks = JSON.parse(raw);
      if (!Array.isArray(oldTasks)) throw new Error("not array");
    } catch (e) {
      resultEl.textContent = "النص مش JSON صحيح - تأكد إنك نسخت كل المحتوى من /api/tasks.";
      return;
    }
    const tasks = currentTasks();
    const existingOldIds = new Set(
      tasks.filter((t) => t.importedFromId).map((t) => t.importedFromId)
    );
    let added = 0, skipped = 0;
    const hasActiveAlready = !!getActiveTask();
    let activeAssigned = hasActiveAlready;
    for (const t of oldTasks) {
      if (!t || !t.id) continue;
      if (existingOldIds.has(String(t.id))) { skipped++; continue; }
      const urgency = OLD_URGENCY_MAP[t.urgency] || "later";
      let status;
      if (t.status === "complete") status = "done";
      else if (t.active && !activeAssigned) { status = "active"; activeAssigned = true; }
      else if (t.parkedAt) status = "park";
      else status = "open";
      tasks.push({
        id: uid(),
        importedFromId: String(t.id),
        note: t.note || "",
        urgency,
        refillEnabled: !!t.refillEnabled,
        refillIdNumber: t.idNumber || "",
        refillPhone: t.phoneNumber || "",
        status,
        createdAt: t.createdAt || new Date().toISOString(),
        parkedAt: t.parkedAt || null,
        completedAt: t.completedAt || null,
      });
      added++;
    }
    saveStore();
    renderAll();
    resultEl.textContent = `تم استيراد ${added} مهمة${skipped ? ` (اتجاهل ${skipped} كانوا مستوردين قبل كده)` : ""}.`;
  };
}

function closeSheet() { document.getElementById("sheetRoot").innerHTML = ""; }
function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ============ منطق المهام ============
const URGENCY_META = {
  now: { label: "🔴 NOW", color: "#B5473A" },
  next: { label: "🟠 NEXT", color: "#C9581E" },
  later: { label: "🟢 LATER", color: "#1E7A46" },
};

function parkColor(parkedAt) {
  const mins = (Date.now() - new Date(parkedAt).getTime()) / 60000;
  if (mins < 30) return "#1E7A46";
  if (mins < 60) return "#C9581E";
  return "#B5473A";
}

function getActiveTask() { return currentTasks().find((t) => t.status === "active") || null; }

function renderAll() {
  document.getElementById("profileChip").textContent = "👤 " + currentProfileName();
  renderActive();
  renderLists();
}

function renderActive() {
  const t = getActiveTask();
  const el = document.getElementById("activeCard");
  if (!t) {
    el.innerHTML = `<div class="empty-msg">أنت clear 🎯<br/>مفيش مهمة شغالة دلوقتي</div>`;
    return;
  }
  el.innerHTML = `
    <div class="active-note">${escapeHtml(t.note)}</div>
    <div class="active-meta">${URGENCY_META[t.urgency].label}${t.refillEnabled ? " · 💊 Refill" : ""}</div>
    <div class="active-actions">
      <button class="btn-park" id="parkActiveBtn">⏸ Park</button>
      <button class="btn-done" id="doneActiveBtn">✅ Done</button>
    </div>
  `;
  document.getElementById("parkActiveBtn").onclick = () => {
    t.status = "park";
    t.parkedAt = new Date().toISOString();
    saveStore();
    renderAll();
  };
  document.getElementById("doneActiveBtn").onclick = () => {
    t.status = "done";
    t.completedAt = new Date().toISOString();
    saveStore();
    playDoneSound();
    renderAll();
  };
}

function renderLists() {
  const tasks = currentTasks();
  const today = new Date().toDateString();
  const q = (taskFilterText || "").trim().toLowerCase();
  const matches = (t) => !q || [t.note, t.refillIdNumber, t.refillPhone].some((v) => (v || "").toLowerCase().includes(q));

  const openTasks = tasks.filter((t) => t.status === "open" && matches(t));
  const parked = tasks.filter((t) => t.status === "park" && matches(t));
  const doneToday = tasks.filter((t) => t.status === "done" && new Date(t.completedAt).toDateString() === today && matches(t));

  const order = { now: 0, next: 1, later: 2 };
  openTasks.sort((a, b) => order[a.urgency] - order[b.urgency]);

  document.getElementById("tasksList").innerHTML =
    openTasks.length === 0
      ? `<p class="empty">مفيش مهام لسه.</p>`
      : openTasks
          .map(
            (t) => `
    <div class="task-row" data-id="${t.id}" data-action="focus">
      <span class="task-dot" style="background:${URGENCY_META[t.urgency].color}"></span>
      <div style="flex:1">
        <div class="task-note">${escapeHtml(t.note)}</div>
        <div class="task-sub">${URGENCY_META[t.urgency].label}${t.refillEnabled ? " · 💊" : ""}</div>
      </div>

function setActiveFromOpen(id) {

    active.status = "park";

  }
  const t = tasks.find((x) => x.id === id);
  t.status = "active";
  saveStore();
  renderAll();
}

function unparkTask(id) {
  const tasks = currentTasks();
  const active = getActiveTask();
  const t = tasks.find((x) => x.id === id);
  if (active) {
    if (!confirm("فيه مهمة شغالة دلوقتي. تحب تعمل Park للمهمة الحالية وترجّع دي بدل منها؟")) return;
    active.status = "park";
    active.parkedAt = new Date().toISOString();
  }
  t.status = "active";
  t.parkedAt = null;
  saveStore();
  renderAll();
}

function playDoneSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g);
    g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    o.start();
    o.stop(ctx.currentTime + 0.4);
  } catch (e) {}
}

document.getElementById("panicBtn").onclick = () => {
  const tasks = currentTasks();
  const order = { now: 0, next: 1, later: 2 };
  const active = getActiveTask();
  const openOnes = tasks.filter((t) => t.status === "open" || t.status === "park" || (t.status === "active"));
  if (openOnes.length === 0) return;
  openOnes.sort((a, b) => order[a.urgency] - order[b.urgency]);
  const winner = openOnes[0];
  const now = new Date().toISOString();
  openOnes.forEach((t) => {
    if (t.id === winner.id) {

      t.parkedAt = now;
    }
  });
  saveStore();
  renderAll();
};

function parseCategoryRows(rows) {
  if (!rows.length) return { items: [], headers: [] };
  const headers = Object.keys(rows[0]);
  const codeCol = findCol(headers, ["MaterialNumber", "MaterialNo", "Material No", "Material Number", "Code", "Item Code", "ItemCode", "SKU", "كود"]);
  const catCol = findCol(headers, ["category", "Category", "كاتيجوري"]);
  const subCol = findCol(headers, ["sub category", "subcategory", "Sub Category", "ساب كاتيجوري"]);
  const items = rows
    .map((r) => ({ code: normalizeCode(r[codeCol]), category: String(r[catCol] || "").trim(), subCategory: String(r[subCol] || "").trim() }))
    .filter((r) => r.code && r.category);
  return { items, headers };
}

function monthlySeriesForItems(items, monthsCount) {
  const dates = items.map((s) => new Date(s.date)).filter((d) => !isNaN(d));
  if (!dates.length) return [];
  const maxDate = new Date(Math.max(...dates.map((d) => d.getTime())));
  const months = [];
  for (let i = monthsCount - 1; i >= 0; i--) {
    const d = new Date(maxDate.getFullYear(), maxDate.getMonth() - i, 1);
    months.push({ key: `${d.getFullYear()}-${d.getMonth()}`, label: d.toLocaleDateString("ar-EG", { month: "short", year: "numeric" }), qty: 0, money: 0 });
  }
  items.forEach((s) => {
    const d = new Date(s.date);
    if (isNaN(d)) return;
    const key = `${d.getFullYear()}-${d.getMonth()}`;
    const m = months.find((mo) => mo.key === key);
    if (m) { m.qty += s.qty || 0; m.money += s.netPrice || 0; }
  });
  return months;
}

async function categoryCompute(mgr) {
  if (!mgr.categoryFile) return null;
  const catRows = (await idbGet(profileKey("categoryFile"))) || [];
  const stockByCode = {};
  ((await idbGet(profileKey("stock"))) || []).forEach((s) => { stockByCode[s.code] = s; });
  const salesItems = (await idbGet(profileKey("sales"))) || [];
  const rates = computeMonthlyRates(salesItems);

  const groups = {};
  catRows.forEach((r) => {
    if (!groups[r.category]) groups[r.category] = [];
    groups[r.category].push(r);
  });

  const catList = Object.keys(groups)
    .map((name) => {
      const rows = groups[name];
      const total = rows.length;
      const covered = rows.filter((r) => stockByCode[r.code] && stockByCode[r.code].balance > 0).length;
      const pct = total ? (covered / total) * 100 : 0;
      const rateSum = rows.reduce((sum, r) => sum + (rates[r.code] || 0), 0);
      return { name, rows, total, covered, pct, rateSum };
    })
    .sort((a, b) => a.name.localeCompare(b.name));

  return { catList, stockByCode, salesItems, rates };
}

function subGroupBreakdown(rows, stockByCode) {
  const subs = {};
  rows.forEach((r) => {
    const key = r.subCategory || "(بدون ساب كاتيجوري)";
    if (!subs[key]) subs[key] = [];
    subs[key].push(r);
  });
  return Object.keys(subs)
    .map((name) => {
      const subRows = subs[name];
      const total = subRows.length;
      const covered = subRows.filter((r) => stockByCode[r.code] && stockByCode[r.code].balance > 0).length;
      return { name, total, covered, pct: total ? (covered / total) * 100 : 0 };
    })
    .sort((a, b) => a.name.localeCompare(b.name));
}

  if (!store.managerByProfile) store.managerByProfile = {};

    store.managerByProfile[store.currentProfileId] = {

      hospitals: [], hospitalDueEntries: [], circulars: [], files: [], reminders: [],
      stock: null, prevStock: null, sales: null, specificCodes: [], specialFile: null, categoryFile: null,
    };
  }
  const mgr = store.managerByProfile[store.currentProfileId];
  if (mgr.stock === undefined) mgr.stock = null;
  if (mgr.prevStock === undefined) mgr.prevStock = null;
  if (mgr.sales === undefined) mgr.sales = null;
  if (!mgr.specificCodes) mgr.specificCodes = [];
  if (mgr.specialFile === undefined) mgr.specialFile = null;
  if (mgr.categoryFile === undefined) mgr.categoryFile = null;

}

function renderManagerGrid(el) {
  el.innerHTML = `<div class="section-label">الإداريات</div><div class="mgr-grid" id="mgrGrid"></div>`;
  const grid = document.getElementById("mgrGrid");
  grid.innerHTML = MANAGER_CARDS.map(
    (c) => `<div class="mgr-card" data-key="${c.key}"><span class="mgr-icon">${c.icon}</span>${c.title}</div>`
  ).join("");
  grid.querySelectorAll("[data-key]").forEach((card) => {
    card.onclick = () => {
      const conf = MANAGER_CARDS.find((c) => c.key === card.dataset.key);
      if (conf.type === "simple") managerView = { name: "simple", key: conf.key };
      else if (conf.type === "hospitals") managerView = { name: "hospitals" };
      else if (conf.type === "circulars") managerView = { name: "circulars" };
      else if (conf.type === "files") managerView = { name: "files" };
      else if (conf.type === "stockManager") managerView = { name: "stockManager", tab: "urgent" };
      renderManager();
    };
  });
}

function backToGrid() { managerView = { name: "grid" }; renderManager(); }

// ============ Stock Manager (الجرد / النواقص) ============
function normalizeCode(code) {
  const s = String(code == null ? "" : code).trim();
  const stripped = s.replace(/^0+/, "");
  return stripped || (s ? "0" : "");
}

function normHeader(s) {
  return String(s || "").toLowerCase().replace(/[\s_\-./]/g, "");
}

function findCol(headers, candidates) {
  const normCandidates = candidates.map(normHeader);
  const normHeaders = headers.map((h) => ({ raw: h, norm: normHeader(h) }));
  for (const cand of normCandidates) {
    const exact = normHeaders.find((h) => h.norm === cand);
    if (exact) return exact.raw;
  }
  for (const cand of normCandidates) {
    const partial = normHeaders.find((h) => h.norm.includes(cand));
    if (partial) return partial.raw;
  }
  return null;
}

function readExcelFile(file) {
  return new Promise((resolve, reject) => {
    if (typeof XLSX === "undefined") { reject(new Error("مكتبة قراءة الإكسل لسه محملتش - محتاج إنترنت أول مرة تستخدم Stock Manager")); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: "array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
        resolve(rows);
      } catch (err) { reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function detectStockCols(headers) {
  return {
    codeCol: findCol(headers, ["MaterialNumber", "MaterialNo", "Material No", "Material Number", "Code", "Item Code", "ItemCode", "SKU", "Item No", "Item Number", "Barcode", "كود", "كود الصنف"]),
    nameCol: findCol(headers, ["name", "Material Name", "Item Name", "Description", "اسم", "اسم الصنف"]),
    balCol: findCol(headers, ["UnRestrictedStock", "Un Restricted Stock", "Stock", "Balance", "Qty", "Quantity", "رصيد"]),
  };
}

function parseStockRows(rows) {
  if (!rows.length) return { items: [], headers: [], cols: {} };
  const headers = Object.keys(rows[0]);
  const cols = detectStockCols(headers);
  const items = rows
    .map((r) => ({ code: normalizeCode(r[cols.codeCol]), name: cols.nameCol ? r[cols.nameCol] : "", balance: parseFloat(r[cols.balCol]) || 0 }))
    .filter((r) => r.code);
  return { items, headers, cols };
}

function detectSalesCols(headers) {
  return {
    codeCol: findCol(headers, ["MaterialNumber", "MaterialNo", "Material No", "Material Number", "Code", "Item Code", "ItemCode", "SKU", "كود"]),
    nameCol: findCol(headers, ["name", "Material Name", "Item Name", "Description", "اسم"]),
    qtyCol: findCol(headers, ["Quantity", "qty", "Qty", "كمية"]),
    priceCol: findCol(headers, ["item net price", "net price", "netprice", "Net Amount", "Amount"]),
    discCol: findCol(headers, ["discount", "خصم"]),
    invTypeCol: findCol(headers, ["Invoice Type", "InvoiceType", "نوع الفاتورة"]),
    dateCol: findCol(headers, ["date", "Invoice Date", "تاريخ"]),
  };
}

function parseSalesRows(rows) {
  if (!rows.length) return { items: [], headers: [], cols: {} };
  const headers = Object.keys(rows[0]);
  const cols = detectSalesCols(headers);
  const items = rows
    .map((r) => ({
      code: normalizeCode(r[cols.codeCol]),
      name: cols.nameCol ? r[cols.nameCol] : "",
      qty: parseFloat(r[cols.qtyCol]) || 0,
      netPrice: cols.priceCol ? parseFloat(r[cols.priceCol]) || 0 : 0,
      discount: cols.discCol ? parseFloat(r[cols.discCol]) || 0 : 0,
      invoiceType: cols.invTypeCol ? String(r[cols.invTypeCol] || "") : "",
      date: cols.dateCol ? r[cols.dateCol] : "",
    }))
    .filter((r) => r.code);
  return { items, headers, cols };
}

function computeMonthlyRates(salesItems) {
  const dates = salesItems.map((s) => new Date(s.date)).filter((d) => !isNaN(d));
  if (!dates.length) return {};
  const maxTime = Math.max(...dates.map((d) => d.getTime()));
  const cutoff = new Date(maxTime);
  cutoff.setMonth(cutoff.getMonth() - 3);
  const sums = {};
  for (const s of salesItems) {
    const d = new Date(s.date);
    if (isNaN(d) || d.getTime() < cutoff.getTime()) continue;
    sums[s.code] = (sums[s.code] || 0) + s.qty;
  }
  const rates = {};
  for (const code in sums) rates[code] = sums[code] / 3;
  return rates;
}

function parseSpecialRows(rows) {
  if (!rows.length) return { codes: [], headers: [] };
  const headers = Object.keys(rows[0]);
  let codeCol = findCol(headers, ["MaterialNumber", "MaterialNo", "Material No", "Material Number", "Code", "Item Code", "ItemCode", "SKU", "كود"]);
  if (!codeCol) codeCol = headers[0]; // ملف Special غالبًا عمود واحد بس - نستخدمه لو مفيش تطابق
  const codes = rows.map((r) => normalizeCode(r[codeCol])).filter(Boolean);
  return { codes, headers };
}

function computeSpecialSalesByMonth(salesItems, specialCodesSet) {
  const relevant = salesItems.filter((s) => specialCodesSet.has(s.code));
  const dates = relevant.map((s) => new Date(s.date)).filter((d) => !isNaN(d));
  if (!dates.length) return [];
  const maxTime = Math.max(...dates.map((d) => d.getTime()));
  const maxDate = new Date(maxTime);
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(maxDate.getFullYear(), maxDate.getMonth() - i, 1);
    months.push({ key: `${d.getFullYear()}-${d.getMonth()}`, label: d.toLocaleDateString("ar-EG", { month: "short", year: "numeric" }), total: 0 });
  }
  relevant.forEach((s) => {
    const d = new Date(s.date);
    if (isNaN(d)) return;
    const key = `${d.getFullYear()}-${d.getMonth()}`;
    const m = months.find((mo) => mo.key === key);
    if (m) m.total += s.netPrice || 0;
  });
  return months;
}

function profileKey(type) { return `${type}:${store.currentProfileId}`; }

async function stockManagerCompute(mgr) {
  const stockItems = (await idbGet(profileKey("stock"))) || [];
  const salesItems = (await idbGet(profileKey("sales"))) || [];
  const stockByCode = {};
  stockItems.forEach((s) => { stockByCode[s.code] = s; });
  const rates = computeMonthlyRates(salesItems);

  const negative = stockItems.filter((s) => s.balance < 0);

  const urgent = stockItems.filter((s) => {
    const rate = rates[s.code] || 0;
    return rate > 0 && s.balance < rate / 4;
  });

  const lost = stockItems
    .filter((s) => s.balance <= 0 && (rates[s.code] || 0) > 2)
    .sort((a, b) => b.balance - a.balance);

  const specialCodesList = mgr.specialFile ? mgr.specialFile.codes : [];
  const specialCodesSet = new Set(specialCodesList);
  const special = specialCodesList
    .map((code) => {
      const st = stockByCode[code];
      return st ? { code, name: st.name, balance: st.balance } : null;
    })
    .filter((i) => i && i.balance !== 0);

  const specialSalesByMonth = computeSpecialSalesByMonth(salesItems, specialCodesSet);

  const specific = mgr.specificCodes.map((sc) => {
    const st = stockByCode[sc.code];
    return { id: sc.id, code: sc.code, name: st ? st.name : "(مش موجود في ملف Stock الحالي)", balance: st ? st.balance : "" };
  });

  return { negative, urgent, lost, special, specialSales: specialSalesByMonth, specific };
}

const STOCK_TABS = [
  { key: "negative", label: "سالبة" },
  { key: "urgent", label: "Urgent Order" },
  { key: "lost", label: "Lost Sales" },
  { key: "special", label: "Special" },
  { key: "specialSales", label: "📊 Special Sales" },
  { key: "specific", label: "جرد" },
];

async function renderStockManager(el) {
  const mgr = currentManager();
  const tab = managerView.tab || "urgent";
  el.innerHTML = `<button class="mgr-back" id="mgrBack">‹ رجوع</button><div class="section-label">Stock Manager</div><p class="empty">جاري تحميل البيانات...</p>`;
  document.getElementById("mgrBack").onclick = backToGrid;
  const data = await stockManagerCompute(mgr);

  el.innerHTML = `
    <button class="mgr-back" id="mgrBack">‹ رجوع</button>
    <div class="section-label">Stock Manager</div>
    <div class="mgr-list-item">
      <div class="row2">ملف Stock: ${mgr.stock ? `محدّث ${new Date(mgr.stock.updatedAt).toLocaleString("ar-EG")} (${mgr.stock.count} صنف)` : "لسه ماترفعش"}</div>
      <input type="file" id="stockFileInput" accept=".xlsx,.xls,.csv" style="margin-top:6px;" />
    </div>
    <div class="mgr-list-item">
      <div class="row2">ملف Sales: ${mgr.sales ? `محدّث ${new Date(mgr.sales.updatedAt).toLocaleString("ar-EG")} (${mgr.sales.count} صف)` : "لسه ماترفعش"}</div>
      <input type="file" id="salesFileInput" accept=".xlsx,.xls,.csv" style="margin-top:6px;" />
    </div>
    <div class="mgr-list-item">
      <div class="row2">ملف Special (كود بس): ${mgr.specialFile ? `محدّث ${new Date(mgr.specialFile.updatedAt).toLocaleString("ar-EG")} (${mgr.specialFile.codes.length} كود)` : "لسه ماترفعش"}</div>
      <input type="file" id="specialFileInput" accept=".xlsx,.xls,.csv" style="margin-top:6px;" />
    </div>
    <p id="stockStatus" style="font-size:13px; color:var(--muted); white-space:pre-wrap;"></p>
    <div class="urgency-row" id="stockTabsRow" style="flex-wrap:wrap;"></div>
    <input class="mgr-search" id="stockSearch" placeholder="بحث بالكود أو الاسم..." />
    <div id="stockResultWrap" style="margin-top:12px;"></div>
  `;
  document.getElementById("mgrBack").onclick = backToGrid;

  document.getElementById("stockFileInput").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const statusEl = document.getElementById("stockStatus");
    statusEl.textContent = "جاري قراءة ملف Stock...";
    try {
      const rows = await readExcelFile(file);
      const { items, headers } = parseStockRows(rows);
      if (items.length === 0) {
        statusEl.textContent = `مقدرتش أعرف الأعمدة صح. الأعمدة اللي في الملف: ${headers.join(", ")}\nابعتلي الأسماء دي عشان أظبط الكود.`;
        return;
      }
      if (mgr.stock) {
        const prevItems = await idbGet(profileKey("stock"));
        if (prevItems) await idbSet(profileKey("prevStock"), prevItems);
        mgr.prevStock = { updatedAt: mgr.stock.updatedAt };
      }
      await idbSet(profileKey("stock"), items);
      mgr.stock = { updatedAt: new Date().toISOString(), count: items.length };
      saveStore();
      renderStockManager(el);
    } catch (err) {
      statusEl.textContent = "حصل خطأ في قراءة الملف: " + err.message;
    }
  };
  document.getElementById("salesFileInput").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const statusEl = document.getElementById("stockStatus");
    statusEl.textContent = "جاري قراءة ملف Sales...";
    try {
      const rows = await readExcelFile(file);
      const { items, headers } = parseSalesRows(rows);
      if (items.length === 0) {
        statusEl.textContent = `مقدرتش أعرف الأعمدة صح. الأعمدة اللي في الملف: ${headers.join(", ")}\nابعتلي الأسماء دي عشان أظبط الكود.`;
        return;
      }
      await idbSet(profileKey("sales"), items);
      mgr.sales = { updatedAt: new Date().toISOString(), count: items.length };
      saveStore();
      renderStockManager(el);
    } catch (err) {
      statusEl.textContent = "حصل خطأ في قراءة الملف: " + err.message;
    }
  };
  document.getElementById("specialFileInput").onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const statusEl = document.getElementById("stockStatus");
    statusEl.textContent = "جاري قراءة ملف Special...";
    try {
      const rows = await readExcelFile(file);
      const { codes, headers } = parseSpecialRows(rows);
      if (codes.length === 0) {
        statusEl.textContent = `مقدرتش ألاقي أكواد في الملف. الأعمدة اللي فيه: ${headers.join(", ")}`;
        return;
      }
      mgr.specialFile = { codes, updatedAt: new Date().toISOString() };
      saveStore();
      renderStockManager(el);
    } catch (err) {
      statusEl.textContent = "حصل خطأ في قراءة الملف: " + err.message;
    }
  };

  const tabsRow = document.getElementById("stockTabsRow");
  tabsRow.innerHTML = STOCK_TABS.map(
    (t) => `<button data-tab="${t.key}" class="${t.key === tab ? "sel-now" : ""}" style="margin:2px;">${t.label} (${data[t.key].length})</button>`
  ).join("");
  tabsRow.querySelectorAll("[data-tab]").forEach((btn) => {
    btn.onclick = () => { managerView.tab = btn.dataset.tab; renderStockManager(el); };
  });

  const searchBox = document.getElementById("stockSearch");
  searchBox.oninput = () => renderStockTabContent(el, mgr, tab, data, searchBox.value);
  if (tab === "specialSales") searchBox.style.display = "none";
  renderStockTabContent(el, mgr, tab, data, "");
}

function renderStockTabContent(el, mgr, tab, data, q) {
  const resultWrap = document.getElementById("stockResultWrap");
  q = (q || "").trim().toLowerCase();
  const filterList = (list) => (q ? list.filter((i) => String(i.code).toLowerCase().includes(q) || String(i.name || "").toLowerCase().includes(q)) : list);

  if (tab === "specialSales") {
    const months = data.specialSales;
    if (months.length === 0) {
      resultWrap.innerHTML = `<p class="empty">محتاج ترفع ملف Special وملف Sales الأول عشان يظهر الجراف.</p>`;
      return;
    }
    const max = Math.max(...months.map((m) => m.total), 1);
    resultWrap.innerHTML = `
      <button class="mgr-add-btn" id="exportSpecialSalesBtn">📤 تصدير</button>
      <div style="display:flex; align-items:flex-end; gap:8px; height:180px; padding:10px 0;">
        ${months
          .map(
            (m) => `
          <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;">
            <div style="font-size:11px; margin-bottom:4px;">${Math.round(m.total)}</div>
            <div style="width:100%; background:linear-gradient(180deg, var(--turq), var(--navy-2)); border-radius:6px 6px 0 0; height:${Math.max((m.total / max) * 140, 2)}px;"></div>
            <div style="font-size:10px; color:var(--muted); margin-top:4px;">${m.label}</div>
          </div>`
          )
          .join("")}
      </div>`;
    document.getElementById("exportSpecialSalesBtn").onclick = () => {
      downloadCSV("special-sales.csv", ["label", "total"], months.map((m) => ({ label: m.label, total: m.total.toFixed(2) })));
    };
    return;
  }

  if (tab === "specific") {
    const list = filterList(data.specific);
    resultWrap.innerHTML =
      `<div style="display:flex; gap:8px;"><button class="mgr-add-btn" id="addSpecificBtn" style="flex:1;">+ إضافة كود</button><button class="mgr-add-btn" id="exportSpecificBtn" style="flex:1;">📤 تصدير</button></div>` +
      (list.length === 0
        ? `<p class="empty">مفيش أكواد مضافة لسه.</p>`
        : list
            .map(
              (i) => `
        <div class="mgr-list-item">
          <div class="row1"><span>${escapeHtml(i.code)} - ${escapeHtml(String(i.name))}</span><span class="del-x" data-delspec="${i.id}">✕</span></div>
          <div class="row2">الرصيد: ${i.balance}</div>
        </div>`
            )
            .join(""));
    document.getElementById("addSpecificBtn").onclick = () => {
      const code = prompt("اكتب كود الصنف:");
      if (!code || !code.trim()) return;
      mgr.specificCodes.push({ id: uid(), code: normalizeCode(code) });
      saveStore();
      renderStockManager(el);
    };
    document.getElementById("exportSpecificBtn").onclick = () => {
      downloadCSV("specific.csv", ["code", "name", "balance"], list);
    };
    resultWrap.querySelectorAll("[data-delspec]").forEach((btn) => {
      btn.onclick = () => {
        mgr.specificCodes = mgr.specificCodes.filter((c) => c.id !== btn.dataset.delspec);
        saveStore();
        renderStockManager(el);
      };
    });
    return;
  }

  const list = filterList(data[tab]);
  resultWrap.innerHTML =
    `<button class="mgr-add-btn" id="exportTabBtn">📤 تصدير</button>` +
    (list.length === 0
      ? `<p class="empty">مفيش أصناف في القايمة دي دلوقتي.</p>`
      : list
          .map(
            (i) => `
      <div class="mgr-list-item">
        <div class="row1"><span>${escapeHtml(String(i.code))} - ${escapeHtml(String(i.name || ""))}</span></div>
        <div class="row2">الرصيد: ${i.balance}</div>
      </div>`
          )
          .join(""));
  document.getElementById("exportTabBtn").onclick = () => {
    downloadCSV(tab + ".csv", ["code", "name", "balance"], list);
  };
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
